name: Build Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许在 GitHub UI 手动触发运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 自动替换 ntdllp.lib 为 ntdll.lib，解决 GitHub Actions runner 缺少 WDK 导致的链接报错
    - name: Patch ntdllp.lib dependency
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -Include "*.cpp", "*.h", "*.vcxproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            if ($content -and $content -match 'ntdllp\.lib') {
                Write-Host "Patching $($_.FullName): changing ntdllp.lib to ntdll.lib"
                $content = $content -replace 'ntdllp\.lib', 'ntdll.lib'
                Set-Content -Path $_.FullName -Value $content -Encoding UTF8
            }
        }

    # 配置 MSBuild 环境变量
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 编译解决方案 (默认使用 Release 配置和 x64 平台)
    - name: Build Solution
      shell: cmd
      run: |
        echo "Building simple-krw-vuln.slnx..."
        msbuild simple-krw-vuln.slnx /p:Configuration=Release /p:Platform=x64 /m /v:m

    # 上传编译产物 (包含 .exe 和 .sys)
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Binaries
        path: |
          x64/Release/**/*
          Release/**/*
          */x64/Release/**/*
          */Release/**/*
